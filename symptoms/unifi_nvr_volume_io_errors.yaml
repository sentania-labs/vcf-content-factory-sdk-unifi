name: "[VCF Content Factory] UniFi NVR Volume I/O Errors"
adapter_kind: unifi_controller
resource_kind: UniFiNvr
severity: WARNING
wait_cycles: 3
cancel_cycles: 3

condition:
  type: property
  key: Storage|volume_issues
  operator: REGEX
  value: "(^|, )io_err:"

description: >
  Triggers when the NVR volume issue list (Storage|volume_issues) contains an io_err entry.
