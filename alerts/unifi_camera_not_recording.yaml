name: "[VCF Content Factory] UniFi Camera Not Recording"
description: >
  Fires when a connected UniFi Protect camera is not recording. A disconnected camera is covered by the Camera Offline alert instead.
adapter_kind: unifi_controller
resource_kind: UniFiCamera
type: 17
sub_type: 18
wait_cycles: 1
cancel_cycles: 1
criticality: WARNING
impact:
  badge: HEALTH
symptom_sets:
  operator: ALL
  sets:
    - defined_on: SELF
      operator: ALL
      symptoms:
        - name: "[VCF Content Factory] UniFi Camera Not Recording"
        - name: "[VCF Content Factory] UniFi Camera Connected"
        - name: "[VCF Content Factory] UniFi Camera Recording Enabled"
recommendations:
  - name: "[VCF Content Factory] UniFi Investigate Camera Not Recording"
    priority: 1
