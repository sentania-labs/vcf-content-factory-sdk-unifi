name: "[VCF Content Factory] UniFi NVR Volume Failed"
adapter_kind: unifi_controller
resource_kind: UniFiNvr
severity: CRITICAL
wait_cycles: 3
cancel_cycles: 3

condition:
  type: property
  key: Storage|volume_health
  operator: EQ
  value: "failed"

description: >
  Triggers when Protect reports the NVR recording volume health as failed (Storage|volume_health).
