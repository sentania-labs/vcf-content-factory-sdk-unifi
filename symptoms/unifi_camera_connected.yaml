name: "[VCF Content Factory] UniFi Camera Connected"
adapter_kind: unifi_controller
resource_kind: UniFiCamera
severity: INFO
wait_cycles: 3
cancel_cycles: 3

condition:
  type: property
  key: Status|is_connected
  operator: EQ
  value: "true"

description: >
  Informational scoping condition: the camera is connected (Status|is_connected is true). Used as the while-connected condition of the not-recording alert.
