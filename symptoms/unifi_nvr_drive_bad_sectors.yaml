name: "[VCF Content Factory] UniFi NVR Drive Bad Sectors"
adapter_kind: unifi_controller
resource_kind: UniFiNvr
severity: WARNING
wait_cycles: 3
cancel_cycles: 3

condition:
  type: metric_static
  key: Storage|drive_bad_sectors
  operator: GT
  value: 0

description: >
  Triggers when an NVR drive reports bad sectors (Storage|drive_bad_sectors above 0).
